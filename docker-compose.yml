# Docker Compose for Plane-GitHub Sync Bot
# Development and production configurations
#
# Traefik: le bot rejoint le réseau Traefik du registry (registry_traefik).
# Sans modifier registry/docker-compose.yml : lancer d'abord le registry pour
# créer le réseau, puis ce compose. Si le projet registry a un autre nom,
# adapter le nom du réseau externe ci-dessous.

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8000}:8000"
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      # Router HTTPS pour le bot (domaine : DOMAIN_BOT dans .env)
      - "traefik.http.routers.bot.rule=Host(`${DOMAIN_BOT}`)"
      - "traefik.http.routers.bot.entrypoints=websecure"
      - "traefik.http.routers.bot.tls=true"
      - "traefik.http.routers.bot.tls.certresolver=letsencrypt"
      - "traefik.http.routers.bot.service=bot"
      - "traefik.http.services.bot.loadbalancer.server.port=8000"
    environment:
      # Plane Configuration
      - PLANE_API_KEY=${PLANE_API_KEY}
      - PLANE_WORKSPACE_SLUG=${PLANE_WORKSPACE_SLUG}
      - PLANE_PROJECT_ID=${PLANE_PROJECT_ID}
      - PLANE_BASE_URL=${PLANE_BASE_URL:-https://api.plane.so}
      - PLANE_WEBHOOK_SECRET=${PLANE_WEBHOOK_SECRET}

      # GitHub App Configuration
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      # Use base64-encoded key for containers (recommended)
      #- GITHUB_APP_PRIVATE_KEY_BASE64=${GITHUB_APP_PRIVATE_KEY_BASE64}
      # Or mount the key file (see volumes below)
      - GITHUB_APP_PRIVATE_KEY_PATH=/app/secrets/github-private-key.pem

      # Bot Configuration
      - PORT=8000
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - DEBUG=${DEBUG:-0}

      # Status Mapping
      - STATUS_MAPPING_FILE=/app/config/status-mapping.yml
    volumes:
      # Mount custom status mapping (optional)
      - ./config/status-mapping.yml:/app/config/status-mapping.yml:ro
      # Mount GitHub private key (if not using base64)
      - ./github-private-key.pem:/app/secrets/github-private-key.pem:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# For development with hot reload
  bot-dev:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - PLANE_API_KEY=${PLANE_API_KEY}
      - PLANE_WORKSPACE_SLUG=${PLANE_WORKSPACE_SLUG}
      - PLANE_PROJECT_ID=${PLANE_PROJECT_ID}
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      - GITHUB_APP_PRIVATE_KEY_BASE64=${GITHUB_APP_PRIVATE_KEY_BASE64}
      - PORT=8000
      - LOG_LEVEL=DEBUG
      - DEBUG=true
      - STATUS_MAPPING_FILE=/app/config/status-mapping.yml
    volumes:
      - ./app:/app/app:ro
      - ./config:/app/config:ro
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    profiles:
      - dev

# Réseau Traefik du registry (créé par registry/docker-compose.yml).
# Nom = {projet_registry}_traefik ; si vous lancez le registry avec un autre
# nom de projet, changez le nom ci-dessous (ex. monregistry_traefik).
networks:
  traefik:
    external: true
    name: notrelec-registry_traefik
